# GitLab is the source of truth. Linux validates portable source; Windows
# control-plane jobs build without MT5; the MT5 runner consumes that artifact.
stages:
  - validate
  - test
  - build
  - smoke
  - package
  - release_sync

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/ && $CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  PYTHON_EXECUTABLE: 'python'
  # MT5_AGENT_WORKER_PRINCIPAL is local Runner policy and is intentionally not
  # defined here. Each Windows host configures its designated principal locally.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  GIT_DEPTH: '1'
  GIT_SUBMODULE_STRATEGY: 'none'

default:
  interruptible: true
  timeout: 15 minutes

.windows-python-job:
  tags:
    - windows-self-hosted-no-mt5
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      & ./deployment/ci.ps1 -Task metadata
      & $env:PYTHON_EXECUTABLE --version
      if ($LASTEXITCODE -ne 0) { throw 'Python is unavailable' }
      & $env:PYTHON_EXECUTABLE -m pip install --index-url https://package-mirror.liara.ir/repository/pypi/simple --prefer-binary -r requirements-dev.txt
      if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      & $env:PYTHON_EXECUTABLE -m pip check
      if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed' }

validate:windows:
  extends: .windows-python-job
  stage: validate
  script:
    - '& ./deployment/ci.ps1 -Task validate -PythonExecutable $env:PYTHON_EXECUTABLE'

test:linux:
  stage: test
  tags:
    - linux-source-unit
  needs:
    - job: validate:windows
      artifacts: false
  script:
    - |
      set -eu
      python3 -m pip install --index-url https://package-mirror.liara.ir/repository/pypi/simple --disable-pip-version-check --prefer-binary --target "$CI_PROJECT_DIR/.ci-python" -r requirements-dev.txt
      export PYTHONPATH="$CI_PROJECT_DIR/.ci-python${PYTHONPATH:+:$PYTHONPATH}"
      python3 -c 'import importlib.util; assert importlib.util.find_spec("MetaTrader5") is None; assert importlib.util.find_spec("numpy") is None'
      python3 -m compileall -q agent main.py
      mkdir -p reports
      python3 -m pytest -q --ignore=tests/test_windows_worker_launcher.py --durations=20 --junitxml=reports/linux-pytest.xml
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/linux-pytest.xml
    paths:
      - reports/linux-pytest.xml

test:windows:
  extends: .windows-python-job
  stage: test
  needs:
    - job: validate:windows
      artifacts: false
  script:
    - '& ./deployment/ci.ps1 -Task test -PythonExecutable $env:PYTHON_EXECUTABLE'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/pytest.xml
    paths:
      - reports/pytest.xml

build:windows:
  stage: build
  tags:
    - windows-self-hosted-no-mt5
  timeout: 20 minutes
  needs:
    - job: test:linux
      artifacts: false
    - job: test:windows
      artifacts: false
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      & ./deployment/ci.ps1 -Task metadata
      & $env:PYTHON_EXECUTABLE -m venv .ci-agent-build-venv
      if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated Agent build environment' }
      $buildPython = Join-Path (Join-Path $PWD '.ci-agent-build-venv') 'Scripts\python.exe'
      & $buildPython -m pip install --index-url https://package-mirror.liara.ir/repository/pypi/simple --prefer-binary -r requirements-dev.txt
      if ($LASTEXITCODE -ne 0) { throw 'Agent build dependencies failed to install' }
      & $buildPython -m pip check
      if ($LASTEXITCODE -ne 0) { throw 'Agent build dependencies are inconsistent' }
      & $buildPython -c 'import importlib.util; raise SystemExit(1 if importlib.util.find_spec("MetaTrader5") else 0)'
      if ($LASTEXITCODE -ne 0) { throw 'MetaTrader5 is installed in the isolated Agent build environment' }
      $env:CI_AGENT_BUILD_PYTHON = $buildPython
  script:
    - '& ./deployment/ci.ps1 -Task build -PythonExecutable $env:CI_AGENT_BUILD_PYTHON -ArtifactName $env:ARTIFACT_NAME'
  artifacts:
    expire_in: 14 days
    paths:
      - dist/MT5Agent-v*.exe
      - reports/build.json

smoke:invalid-configuration:
  before_script:
    - '& ./deployment/ci.ps1 -Task metadata'
  stage: smoke
  tags:
    - windows-self-hosted-no-mt5
  timeout: 5 minutes
  needs:
    - job: build:windows
      artifacts: true
  script:
    - '& ./deployment/ci.ps1 -Task smoke-invalid -ArtifactName $env:ARTIFACT_NAME'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/MT5Agent-v*.exe
      - reports/build.json
      - reports/invalid-configuration.json

smoke:control-plane:
  before_script:
    - '& ./deployment/ci.ps1 -Task metadata'
  stage: smoke
  tags:
    - windows-self-hosted-no-mt5
  timeout: 5 minutes
  needs:
    - job: smoke:invalid-configuration
      artifacts: true
  script:
    - '& ./deployment/ci.ps1 -Task smoke-control-plane -ArtifactName $env:ARTIFACT_NAME'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/MT5Agent-v*.exe
      - reports/build.json
      - reports/invalid-configuration.json
      - reports/control-plane.json

smoke:mt5-runtime:
  before_script:
    - '& ./deployment/ci.ps1 -Task metadata'
  stage: smoke
  tags:
    - windows-self-hosted-mt5
  timeout: 20 minutes
  needs:
    - job: smoke:control-plane
      artifacts: true
  script:
    - '& ./deployment/ci.ps1 -Task smoke-mt5-runtime -ArtifactName $env:ARTIFACT_NAME'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/MT5Agent-v*.exe
      - reports/build.json
      - reports/invalid-configuration.json
      - reports/control-plane.json
      - reports/mt5-runtime.json

package:windows:
  before_script:
    - '& ./deployment/ci.ps1 -Task metadata'
  stage: package
  tags:
    - windows-self-hosted-no-mt5
  timeout: 5 minutes
  needs:
    - job: smoke:mt5-runtime
      artifacts: true
  script:
    - '& ./deployment/ci.ps1 -Task package -ArtifactName $env:ARTIFACT_NAME'
  artifacts:
    name: 'MT5Agent-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA'
    expire_in: 30 days
    paths:
      - dist/MT5Agent-v*.exe
      - reports/build.json
      - reports/invalid-configuration.json
      - reports/control-plane.json
      - reports/mt5-runtime.json
      - reports/release-evidence.json
      - sha256.txt

# GitLab Release remains authoritative and is published after its package files
# are ready. This final tag job waits for that metadata and the mirrored tag;
# it fails closed unless the tag is protected and the GitHub token is present.
release:github-sync:
  stage: release_sync
  tags:
    - linux-source-unit
  timeout: 20 minutes
  needs:
    - job: package:windows
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - when: never
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
  script:
    - python3 tools/release_sync/github_release_sync.py
